name: Release

# One responsibility: publish the GitHub release for the tag on main. Triggered
# by the Version run completing, because a tag pushed with GITHUB_TOKEN emits no
# push event of its own.
on:
  workflow_run:
    workflows:
      - Version
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the tag on main
        id: tag
        run: |
          tag="$(git describe --tags --exact-match)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release ${tag}"
      - name: Build tarball
        run: npm pack
      - name: Record tarball SHA-256
        run: |
          echo '### Tarball SHA-256' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sha256sum *.tgz >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum *.tgz
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: '*.tgz'
